<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>項目4 PoC — MapLibre 当たり判定（bbox方式）</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0c10;
      }
      #map {
        position: absolute;
        inset: 0;
      }
      .panel {
        position: absolute;
        z-index: 10;
        background: rgba(18, 21, 26, 0.92);
        color: #e5e7eb;
        font: 12px/1.5 system-ui, sans-serif;
        padding: 10px 12px;
        border-radius: 8px;
      }
      #controls {
        top: 8px;
        right: 8px;
        min-width: 220px;
      }
      #controls label {
        display: block;
        margin: 6px 0 2px;
        color: #9ca3af;
      }
      #controls input[type='range'] {
        width: 100%;
      }
      #controls p {
        margin: 8px 0 0;
        color: #9ca3af;
      }
      #stat {
        left: 8px;
        bottom: 8px;
        color: #a7f3d0;
        font-family: ui-monospace, monospace;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="controls" class="panel">
      <label>許容半径 r（px）（本番 tolerance:8 相当）: <span id="rVal">8</span></label>
      <input id="r" type="range" min="2" max="12" step="1" value="8" />
      <p>地図（オレンジ=活断層、シアン=テスト線）をクリックすると r px の bbox で当たり判定します。</p>
    </div>
    <div id="stat" class="panel">loading…</div>
    <script type="module" src="/poc/hittest.ts"></script>
  </body>
</html>
