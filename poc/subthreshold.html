<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>検証項目5 PoC — KyoshinSubThreshold 非加算合成</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0c10;
        color: #e5e7eb;
        font: 13px/1.5 system-ui, sans-serif;
      }
      #wrap {
        display: flex;
        height: 100vh;
      }
      .col {
        flex: 1;
        display: flex;
        flex-direction: column;
        border-right: 1px solid #222;
        min-width: 0;
      }
      .col:last-child {
        border-right: none;
      }
      .label {
        padding: 6px 10px;
        background: rgba(18, 21, 26, 0.95);
        border-bottom: 1px solid #222;
        font-size: 12px;
      }
      .label b {
        color: #a7f3d0;
      }
      .map {
        flex: 1;
        min-height: 0;
      }
      #stat {
        position: absolute;
        left: 8px;
        bottom: 8px;
        z-index: 10;
        background: rgba(18, 21, 26, 0.92);
        padding: 8px 10px;
        border-radius: 8px;
        font-family: ui-monospace, monospace;
        white-space: pre;
        color: #a7f3d0;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div class="col">
        <div class="label"><b>A. 標準 circle</b> — 素朴版（同レベルも加算 → ① 違反）</div>
        <div id="map-std" class="map"></div>
      </div>
      <div class="col">
        <div class="label"><b>現行 SVG 見本</b> — 正解（&lt;g opacity&gt; 二層合成）</div>
        <div id="map-svg" class="map" style="position: relative"></div>
      </div>
      <div class="col">
        <div class="label"><b>B. カスタムレイヤー FBO</b> — 目標（① 非加算 / ② レベル間加算）</div>
        <div id="map-custom" class="map"></div>
      </div>
    </div>
    <div id="stat">loading…</div>
    <script type="module" src="/poc/subthreshold.ts"></script>
  </body>
</html>
